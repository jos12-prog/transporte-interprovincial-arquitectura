<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Contexto del Sistema - Nivel 1 C4</title>
  <desc id="desc">Diagrama de Contexto de la Plataforma Integrada de Reservas y Gestión de Transporte Interprovincial</desc>

  <defs>
    <!-- Marcador de flecha derecha azul -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <!-- Marcador de flecha doble para pagos -->
    <marker id="arrow-blue-both" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>

    <style>
      .card-actor { fill: #f8fbff; stroke: #2563eb; stroke-width: 1.8; rx: 16px; }
      .card-system { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 18px; }
      .card-ext { fill: #f8fbff; stroke: #2563eb; stroke-width: 1.8; rx: 16px; }
      .system-boundary { fill: none; stroke: #22c55e; stroke-width: 1.8; stroke-dasharray: 6 5; rx: 6px; }

      .pill-bg { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.5; rx: 12px; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 600; fill: #1d4ed8; text-anchor: middle; dominant-baseline: central; }

      .conn-line { fill: none; stroke: #60a5fa; stroke-width: 1.6; }

      .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1e3a8a; text-anchor: middle; }
      .actor-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #1e40af; text-anchor: middle; }

      .system-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #14532d; text-anchor: middle; }
      .system-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #166534; text-anchor: middle; }

      .boundary-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #334155; letter-spacing: 1.2px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Fondo blanco -->
  <rect width="1120" height="520" fill="#ffffff" />

  <!-- ================= LÍNEAS DE CONEXIÓN Y ETIQUETAS (DETRÁS) ================= -->

  <!-- ACT01 -> Sistema -->
  <path d="M 235 55 C 310 55, 310 160, 435 160" class="conn-line" marker-end="url(#arrow-blue)" />
  <rect x="290" y="42" width="75" height="26" class="pill-bg" />
  <text x="327.5" y="55" class="pill-text">Utiliza</text>

  <!-- ACT02 -> Sistema -->
  <path d="M 235 180 L 435 180" class="conn-line" marker-end="url(#arrow-blue)" />
  <rect x="295" y="167" width="65" height="26" class="pill-bg" />
  <text x="327.5" y="180" class="pill-text">Opera</text>

  <!-- ACT03 -> Sistema -->
  <path d="M 235 305 C 310 305, 310 270, 435 270" class="conn-line" marker-end="url(#arrow-blue)" />
  <rect x="282" y="292" width="90" height="26" class="pill-bg" />
  <text x="327.5" y="305" class="pill-text">Administra</text>

  <!-- ACT04 -> Sistema -->
  <path d="M 235 430 C 375 430, 375 350, 435 350" class="conn-line" marker-end="url(#arrow-blue)" />
  <rect x="250" y="417" width="155" height="26" class="pill-bg" />
  <text x="327.5" y="430" class="pill-text">Supervisa y configura</text>

  <!-- Sistema -> Pasarela de Pagos -->
  <path d="M 695 190 L 875 190" class="conn-line" marker-end="url(#arrow-blue)" />
  <rect x="735" y="177" width="160" height="26" class="pill-bg" />
  <text x="815" y="190" class="pill-text">Solicita y verifica pagos</text>

  <!-- Sistema -> Proveedor de Notificaciones -->
  <path d="M 695 290 C 750 290, 750 330, 875 330" class="conn-line" marker-end="url(#arrow-blue)" />
  <rect x="740" y="280" width="150" height="26" class="pill-bg" />
  <text x="815" y="293" class="pill-text">Solicita notificaciones</text>

  <!-- ================= LÍMITE DEL SISTEMA ================= -->
  <g id="limite-sistema">
    <rect x="425" y="85" width="280" height="355" class="system-boundary" />
    <text x="565" y="103" class="boundary-label">LÍMITE DEL SISTEMA</text>
  </g>

  <!-- ================= SISTEMA CENTRAL ================= -->
  <g id="sistema-central">
    <rect x="435" y="120" width="260" height="305" class="card-system" />
    
    <text x="565" y="152" class="system-title">PLATAFORMA</text>
    <text x="565" y="170" class="system-title">INTEGRADA DE RESERVAS</text>
    <text x="565" y="188" class="system-title">Y GESTIÓN DE TRANSPORTE</text>
    <text x="565" y="206" class="system-title">INTERPROVINCIAL</text>

    <text x="565" y="250" class="system-desc">Consulta de servicios · Reservas</text>
    <text x="565" y="268" class="system-desc">y pasajes</text>
    <text x="565" y="292" class="system-desc">Ventas y pagos · Gestión de</text>
    <text x="565" y="310" class="system-desc">encomiendas</text>
    <text x="565" y="336" class="system-desc">Administración multiempresa</text>
  </g>

  <!-- ================= ACTORES (IZQUIERDA) ================= -->

  <!-- ACT01 -->
  <g id="act01">
    <rect x="20" y="15" width="215" height="80" class="card-actor" />
    <text x="127.5" y="40" class="actor-title">ACT01 · PASAJERO /</text>
    <text x="127.5" y="56" class="actor-title">CLIENTE</text>
    <text x="127.5" y="74" class="actor-desc">Consulta viajes, reserva pasajes</text>
    <text x="127.5" y="88" class="actor-desc">y gestiona encomiendas</text>
  </g>

  <!-- ACT02 -->
  <g id="act02">
    <rect x="20" y="140" width="215" height="80" class="card-actor" />
    <text x="127.5" y="165" class="actor-title">ACT02 · AGENTE /</text>
    <text x="127.5" y="181" class="actor-title">VENDEDOR</text>
    <text x="127.5" y="199" class="actor-desc">Ventas presenciales, reservas</text>
    <text x="127.5" y="213" class="actor-desc">y operaciones de encomiendas</text>
  </g>

  <!-- ACT03 -->
  <g id="act03">
    <rect x="20" y="265" width="215" height="80" class="card-actor" />
    <text x="127.5" y="288" class="actor-title">ACT03 · ADMINISTRADOR</text>
    <text x="127.5" y="304" class="actor-title">DE AGENCIA</text>
    <text x="127.5" y="322" class="actor-desc">Gestiona servicios y</text>
    <text x="127.5" y="336" class="actor-desc">operaciones de su empresa</text>
  </g>

  <!-- ACT04 -->
  <g id="act04">
    <rect x="20" y="390" width="215" height="80" class="card-actor" />
    <text x="127.5" y="415" class="actor-title">ACT04 ·</text>
    <text x="127.5" y="431" class="actor-title">SUPERADMINISTRADOR</text>
    <text x="127.5" y="449" class="actor-desc">Administra empresas, accesos</text>
    <text x="127.5" y="463" class="actor-desc">y supervisa la plataforma</text>
  </g>

  <!-- ================= SISTEMAS EXTERNOS (DERECHA) ================= -->

  <!-- Pasarela de Pagos -->
  <g id="ext-pagos">
    <rect x="875" y="145" width="225" height="90" class="card-ext" />
    <text x="987.5" y="177" class="actor-title">PASARELA DE PAGOS</text>
    <text x="987.5" y="202" class="actor-desc">Procesamiento y verificación</text>
    <text x="987.5" y="218" class="actor-desc">de pagos electrónicos</text>
  </g>

  <!-- Proveedor de Notificaciones -->
  <g id="ext-notificaciones">
    <rect x="875" y="285" width="225" height="90" class="card-ext" />
    <text x="987.5" y="320" class="actor-title">PROVEEDOR DE</text>
    <text x="987.5" y="337" class="actor-title">NOTIFICACIONES</text>
    <text x="987.5" y="358" class="actor-desc">Entrega de comunicaciones</text>
  </g>
</svg>
