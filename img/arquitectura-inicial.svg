<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura inicial de la plataforma de transporte interprovincial</title>
<desc id="desc">Usuarios, aplicación web React, API ASP.NET Core, monolito modular con tres grupos funcionales, PostgreSQL, almacenamiento de objetos y servicios externos.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker><style>text{font-family:Arial,Helvetica,sans-serif} .h{font-size:18px;font-weight:700;fill:#172554}.sub{font-size:14px;fill:#334155}.group{font-size:18px;font-weight:700;fill:#0f172a}.small{font-size:14px;fill:#334155}.line{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}.node{stroke-width:2}</style></defs>
<rect width="1280" height="820" fill="#ffffff"/>
<text x="640" y="43" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Arquitectura inicial del sistema</text>
<text x="640" y="69" text-anchor="middle" font-size="15" fill="#475569">Plataforma integrada de reservas y gestión de transporte interprovincial</text>
<rect x="330" y="91" width="620" height="64" rx="12" fill="#eff6ff" stroke="#60a5fa" class="node"/>
<text x="640" y="116" text-anchor="middle" class="h">USUARIOS</text><text x="640" y="139" text-anchor="middle" class="sub">Pasajero / Cliente · Agente / Vendedor · Administrador de Agencia · Superadministrador</text>
<path d="M640 155 V181" class="line"/>
<rect x="410" y="184" width="460" height="67" rx="12" fill="#eff6ff" stroke="#60a5fa" class="node"/>
<text x="640" y="210" text-anchor="middle" class="h">APLICACIÓN WEB</text><text x="640" y="233" text-anchor="middle" class="sub">React · TypeScript · Vite</text>
<path d="M640 251 V278" class="line"/>
<rect x="410" y="281" width="460" height="70" rx="12" fill="#ecfdf5" stroke="#34d399" class="node"/>
<text x="640" y="308" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">API REST / HTTPS</text><text x="640" y="332" text-anchor="middle" font-size="14" fill="#14532d">ASP.NET Core · Autenticación y autorización</text>
<path d="M640 351 V387" class="line"/>
<rect x="65" y="391" width="1150" height="238" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
<text x="640" y="426" text-anchor="middle" class="group">MONOLITO MODULAR · CLEAN ARCHITECTURE</text>
<text x="640" y="449" text-anchor="middle" font-size="14" fill="#475569">Arquitectura en capas · Módulos internos del mismo backend</text>
<rect x="91" y="473" width="346" height="124" rx="11" fill="#eaf2ff" stroke="#93b4de" stroke-width="2"/>
<text x="264" y="501" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">ADMINISTRACIÓN</text>
<text x="264" y="529" text-anchor="middle" class="small">Empresas y agencias</text><text x="264" y="553" text-anchor="middle" class="small">Rutas y vehículos</text><text x="264" y="577" text-anchor="middle" class="small">Programación de viajes</text>
<rect x="467" y="473" width="346" height="124" rx="11" fill="#ecfdf5" stroke="#86c9aa" stroke-width="2"/>
<text x="640" y="501" text-anchor="middle" font-size="17" font-weight="700" fill="#14532d">OPERACIONES TRANSACCIONALES</text>
<text x="640" y="529" text-anchor="middle" class="small">Reservas y pasajes</text><text x="640" y="553" text-anchor="middle" class="small">Ventas y pagos</text><text x="640" y="577" text-anchor="middle" class="small">Encomiendas</text>
<rect x="843" y="473" width="346" height="124" rx="11" fill="#f5f3ff" stroke="#b3a5e2" stroke-width="2"/>
<text x="1016" y="501" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">CONSULTAS Y SOPORTE</text>
<text x="1016" y="529" text-anchor="middle" class="small">Búsquedas y reportes</text><text x="1016" y="553" text-anchor="middle" class="small">Auditoría</text><text x="1016" y="577" text-anchor="middle" class="small">Notificaciones</text>
<path d="M640 629 V655 M210 655 H1070 M210 655 V687 M640 655 V687 M1070 655 V687" fill="none" stroke="#64748b" stroke-width="2.3"/>
<path d="M210 675 V687 M640 675 V687 M1070 675 V687" class="line"/>
<rect x="69" y="693" width="282" height="82" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="210" y="723" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">PostgreSQL</text><text x="210" y="749" text-anchor="middle" font-size="14" fill="#78350f">Datos y transacciones</text>
<rect x="499" y="693" width="282" height="82" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
<text x="640" y="723" text-anchor="middle" font-size="18" font-weight="700" fill="#78350f">Almacenamiento de objetos</text><text x="640" y="749" text-anchor="middle" font-size="14" fill="#78350f">Logos y fotografías</text>
<rect x="929" y="693" width="282" height="82" rx="11" fill="#faf5ff" stroke="#a78bfa" stroke-width="2"/>
<text x="1070" y="723" text-anchor="middle" font-size="18" font-weight="700" fill="#581c87">Servicios externos</text><text x="1070" y="749" text-anchor="middle" font-size="14" fill="#581c87">Pagos y notificaciones</text>
<text x="640" y="804" text-anchor="middle" font-size="12" fill="#64748b">Diagrama conceptual: las conexiones inferiores representan dependencias lógicas, no acceso directo desde el dominio.</text>
</svg>
