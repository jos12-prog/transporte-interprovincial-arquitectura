<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="780" viewBox="0 0 1260 780" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de Secuencia - Confirmar Reserva con Pago</title>
  <desc id="desc">Diagrama de Secuencia para el flujo de confirmación de reserva y pago</desc>

  <defs>
    <!-- Marcador de flecha para llamadas síncronas -->
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <!-- Marcador de flecha para retornos (línea discontinua) -->
    <marker id="arrow-return" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>

    <style>
      .title-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1a202c; }
      .title-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 400; fill: #718096; }

      .box-part { stroke-width: 1.5; rx: 4px; }
      .text-p-name { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
      .text-p-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 400; fill: #64748b; text-anchor: middle; }

      .lifeline { stroke: #cbd5e1; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .activation { fill: #ffffff; stroke: #334155; stroke-width: 1; rx: 1px; }

      .msg-line { stroke: #334155; stroke-width: 1.2; }
      .return-line { stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; fill: #1e293b; font-weight: 500; }
      .return-text { font-family: "SFMono-Regular", Consolas, monospace; font-size: 9px; fill: #475569; }

      .frame-box { fill: none; stroke: #64748b; stroke-width: 1.2; rx: 2px; }
      .frame-divider { stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .frame-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #1e293b; }

      .note-box { fill: #fffbeb; stroke: #fde047; stroke-width: 1; rx: 2px; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #78350f; }
    </style>
  </defs>

  <!-- Fondo blanco -->
  <rect width="1260" height="780" fill="#ffffff" />

  <!-- ================= ENCABEZADO SUPERIOR ================= -->
  <text x="35" y="32" class="title-main">[Diagrama de secuencia] Confirmar reserva con pago</text>
  <text x="35" y="48" class="title-sub">Modelo C4 · Nivel 4 · POST /api/v1/reservations/{id}/confirm · flujo principal y pago rechazado</text>

  <!-- ================= LÍNEAS DE VIDA (LIFELINES) ================= -->
  <!-- 1. Cliente web: X = 80 -->
  <line x1="80" y1="95" x2="80" y2="745" class="lifeline" />
  <!-- 2. Controller: X = 205 -->
  <line x1="205" y1="95" x2="205" y2="745" class="lifeline" />
  <!-- 3. UseCase Reservas: X = 350 -->
  <line x1="350" y1="95" x2="350" y2="745" class="lifeline" />
  <!-- 4. Reservation: X = 490 -->
  <line x1="490" y1="95" x2="490" y2="745" class="lifeline" />
  <!-- 5. ProcessPaymentUseCase: X = 630 -->
  <line x1="630" y1="95" x2="630" y2="745" class="lifeline" />
  <!-- 6. IPaymentPort: X = 770 -->
  <line x1="770" y1="95" x2="770" y2="745" class="lifeline" />
  <!-- 7. Pasarela de pago: X = 895 -->
  <line x1="895" y1="95" x2="895" y2="745" class="lifeline" />
  <!-- 8. IReservationRepository: X = 1030 -->
  <line x1="1030" y1="95" x2="1030" y2="745" class="lifeline" />
  <!-- 9. INotificationPort: X = 1165 -->
  <line x1="1165" y1="95" x2="1165" y2="745" class="lifeline" />

  <!-- ================= CABECERAS DE PARTICIPANTES ================= -->
  <!-- 1. Cliente web -->
  <rect x="25" y="60" width="110" height="38" fill="#f8fafc" stroke="#94a3b8" class="box-part" />
  <text x="80" y="78" class="text-p-name" fill="#334155">:Cliente web</text>

  <!-- 2. Controller -->
  <rect x="145" y="60" width="120" height="38" fill="#eff6ff" stroke="#2563eb" class="box-part" />
  <text x="205" y="76" class="text-p-name" fill="#1e3a8a">:ReservationsController</text>
  <text x="205" y="89" class="text-p-sub">reservas</text>

  <!-- 3. ConfirmReservationUseCase -->
  <rect x="275" y="60" width="150" height="38" fill="#f0fdf4" stroke="#16a34a" class="box-part" />
  <text x="350" y="76" class="text-p-name" fill="#14532d">:ConfirmReservationUseCase</text>
  <text x="350" y="89" class="text-p-sub">reservas</text>

  <!-- 4. Reservation -->
  <rect x="435" y="60" width="110" height="38" fill="#fffbeb" stroke="#d97706" class="box-part" />
  <text x="490" y="76" class="text-p-name" fill="#78350f">:Reservation</text>
  <text x="490" y="89" class="text-p-sub">reservas</text>

  <!-- 5. ProcessPaymentUseCase -->
  <rect x="555" y="60" width="150" height="38" fill="#f0fdf4" stroke="#16a34a" class="box-part" />
  <text x="630" y="76" class="text-p-name" fill="#14532d">:ProcessPaymentUseCase</text>
  <text x="630" y="89" class="text-p-sub">pagos</text>

  <!-- 6. IPaymentPort -->
  <rect x="715" y="60" width="110" height="38" fill="#faf5ff" stroke="#7c3aed" class="box-part" />
  <text x="770" y="76" class="text-p-name" fill="#581c87">:IPaymentPort</text>
  <text x="770" y="89" class="text-p-sub">StripePaymentAdapter</text>

  <!-- 7. Pasarela de pago -->
  <rect x="835" y="60" width="120" height="38" fill="#f8fafc" stroke="#94a3b8" class="box-part" />
  <text x="895" y="76" class="text-p-name" fill="#334155">Pasarela de pago</text>
  <text x="895" y="89" class="text-p-sub">sistema externo</text>

  <!-- 8. IReservationRepository -->
  <rect x="965" y="60" width="130" height="38" fill="#faf5ff" stroke="#7c3aed" class="box-part" />
  <text x="1030" y="76" class="text-p-name" fill="#581c87">:IReservationRepo</text>
  <text x="1030" y="89" class="text-p-sub">PostgresRepository</text>

  <!-- 9. INotificationPort -->
  <rect x="1105" y="60" width="120" height="38" fill="#faf5ff" stroke="#7c3aed" class="box-part" />
  <text x="1165" y="76" class="text-p-name" fill="#581c87">:INotificationPort</text>
  <text x="1165" y="89" class="text-p-sub">NotificationAdapter</text>

  <!-- ================= BARRAS DE ACTIVACIÓN ================= -->
  <!-- Controller activation -->
  <rect x="200" y="125" width="10" height="595" class="activation" />
  <!-- UseCase activation -->
  <rect x="345" y="145" width="10" height="555" class="activation" />
  <!-- Repository activation (get) -->
  <rect x="1025" y="170" width="10" height="30" class="activation" />
  <!-- Reservation activation (total) -->
  <rect x="485" y="215" width="10" height="25" class="activation" />
  <!-- ProcessPayment activation -->
  <rect x="625" y="255" width="10" height="150" class="activation" />
  <!-- PaymentPort activation -->
  <rect x="765" y="280" width="10" height="105" class="activation" />
  <!-- Pasarela activation -->
  <rect x="890" y="305" width="10" height="60" class="activation" />
  <!-- Reservation activation (confirm) -->
  <rect x="485" y="495" width="10" height="25" class="activation" />
  <!-- Repository activation (save) -->
  <rect x="1025" y="530" width="10" height="25" class="activation" />
  <!-- Notification activation -->
  <rect x="1160" y="565" width="10" height="25" class="activation" />

  <!-- ================= MENSAJES Y PASOS ================= -->

  <!-- 1. POST /api/v1/reservations/{id}/confirm -->
  <path d="M 80 125 L 200 125" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="85" y="120" class="msg-text">1. POST /api/v1/reservations/{id}/confirm [tokenPago] + JWT</text>

  <!-- 2. ejecutar(cmd) -->
  <path d="M 210 145 L 345 145" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="215" y="140" class="msg-text">2. ejecutar(cmd)</text>

  <!-- 3. buscarPorId(id) -->
  <path d="M 355 170 L 1025 170" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="360" y="165" class="msg-text">3. buscarPorId(id)</text>

  <!-- Retorno 3: reserva [HELD] -->
  <path d="M 1025 195 L 355 195" class="return-line" marker-end="url(#arrow-return)" />
  <text x="360" y="190" class="return-text">reserva [HELD]</text>

  <!-- 4. total() -->
  <path d="M 355 215 L 485 215" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="360" y="210" class="msg-text">4. total()</text>

  <!-- Retorno 4: monto -->
  <path d="M 485 235 L 355 235" class="return-line" marker-end="url(#arrow-return)" />
  <text x="360" y="230" class="return-text">monto</text>

  <!-- 5. ejecutar(monto, tokenPago) hacia módulo Pagos -->
  <path d="M 355 255 L 625 255" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="360" y="250" class="msg-text">5. ejecutar(monto, tokenPago)</text>

  <!-- 6. cobrar(monto, token) -->
  <path d="M 635 280 L 765 280" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="640" y="275" class="msg-text">6. cobrar(monto, token)</text>

  <!-- 7. solicitud de cobro [HTTPS] -->
  <path d="M 775 305 L 890 305" class="msg-line" marker-end="url(#arrow-sync)" />
  <text x="780" y="300" class="msg-text">7. solicitud de cobro [HTTPS]</text>

  <!-- Retorno 7: respuesta pasarela -->
  <path d="M 890 360 L 775 360" class="return-line" marker-end="url(#arrow-return)" />
  <text x="785" y="355" class="return-text">respuesta</text>

  <!-- Retorno a ProcessPayment: PaymentResult -->
  <path d="M 765 380 L 635 380" class="return-line" marker-end="url(#arrow-return)" />
  <text x="655" y="375" class="return-text">PaymentResult</text>

  <!-- Retorno a UseCase: PaymentResult -->
  <path d="M 625 400 L 355 400" class="return-line" marker-end="url(#arrow-return)" />
  <text x="375" y="395" class="return-text">PaymentResult</text>

  <!-- ================= MARCO ALT (CONDICIONAL) ================= -->
  <g id="frame-alt">
    <rect x="25" y="445" width="1210" height="280" class="frame-box" />
    <polygon points="25,445 65,445 75,457 75,465 25,465" fill="#f1f5f9" stroke="#64748b" stroke-width="1" />
    <text x="33" y="458" class="frame-tag">alt</text>
    <text x="85" y="462" class="frame-tag" fill="#15803d">[cobro.aprobado]</text>

    <!-- 8. marcarConfirmada(autorizacion) -->
    <path d="M 355 495 L 485 495" class="msg-line" marker-end="url(#arrow-sync)" />
    <text x="360" y="490" class="msg-text">8. marcarConfirmada(autorizacion)</text>

    <!-- 9. guardar(reserva) — UPDATE [SQL] -->
    <path d="M 355 530 L 1025 530" class="msg-line" marker-end="url(#arrow-sync)" />
    <text x="360" y="525" class="msg-text">9. guardar(reserva) — UPDATE [SQL]</text>

    <!-- 10. notificarReservaConfirmada(reserva) [HTTPS] -->
    <path d="M 355 565 L 1160 565" class="msg-line" marker-end="url(#arrow-sync)" />
    <text x="360" y="560" class="msg-text">10. notificarReservaConfirmada(reserva) [HTTPS]</text>

    <!-- Retorno UseCase -> Controller -->
    <path d="M 345 595 L 210 595" class="return-line" marker-end="url(#arrow-return)" />
    <text x="245" y="590" class="return-text">reservaId</text>

    <!-- 11. 201 Created {reservaId} -->
    <path d="M 200 615 L 80 615" class="return-line" marker-end="url(#arrow-return)" />
    <text x="85" y="610" class="msg-text">11. 200 OK {reservaId, boleto}</text>

    <!-- Línea divisoria de [else] -->
    <line x1="25" y1="635" x2="1235" y2="635" class="frame-divider" />
    <text x="35" y="650" class="frame-tag" fill="#b91c1c">[else: pago rechazado]</text>

    <!-- 12. PagoRechazadoError -->
    <path d="M 345 680 L 210 680" class="return-line" marker-end="url(#arrow-return)" />
    <text x="220" y="675" class="return-text">12. PagoRechazadoError</text>

    <!-- 13. 402 Payment Required {motivo} -->
    <path d="M 200 705 L 80 705" class="return-line" marker-end="url(#arrow-return)" />
    <text x="85" y="700" class="msg-text">13. 402 Payment Required {motivo}</text>

    <!-- NOTA AMARILLA EXPLICATIVA -->
    <polygon points="520,645 845,645 860,660 860,715 520,715" class="note-box" />
    <polygon points="845,645 845,660 860,660" fill="#fef08a" stroke="#fde047" stroke-width="1" />
    <text x="530" y="663" class="note-text" font-weight="700">Si el pago es rechazado, la reserva no se confirma</text>
    <text x="530" y="678" class="note-text">ni se emite el boleto. El asiento se libera al</text>
    <text x="530" y="693" class="note-text">expirar la retención. El controlador traduce el</text>
    <text x="530" y="707" class="note-text">error a un código HTTP adecuado.</text>
  </g>
</svg>
