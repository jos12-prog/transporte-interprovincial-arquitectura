<!DOCTYPE html>

<meta charset="UTF-8">

        <path d="M7 111 C 30 108, 44 98, 40 82 C 36 66, 66 66, 62 52 C 59 43, 56 44, 57 40" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
        <path class="ra-road" d="M7 111 C 30 108, 44 98, 40 82 C 36 66, 66 66, 62 52 C 59 43, 56 44, 57 40" fill="none" stroke="#123A35" stroke-width="7.5" stroke-linecap="round"/>

      <span class="wordmark">Ruta<span>Andina</span></span>
    </div>

    <h1 id="titulo" class="in" style="--i:1">Inicia sesión</h1>
    <p class="lead in" style="--i:2">Reserva tu asiento y revisa tus pasajes en un solo lugar.</p>

    <!-- Opción más directa primero: un toque y entra con su cuenta de Google -->
    <button type="button" class="gbtn in" style="--i:3" id="google" data-state="idle">
      <span class="layers">
        <span class="layer" data-layer="idle">
          <svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continuar con Google
        </span>
        <span class="layer" data-layer="loading"><span class="spin" aria-hidden="true"></span>Conectando con Google…</span>
      </span>
    </button>

    <div class="sep in" style="--i:4" role="separator"><span>o con tu correo o DNI</span></div>

    <form id="form" novalidate>
      <div class="field in" id="f-user" style="--i:5">
        <label for="user">Correo o DNI</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5"/></svg>
          <input id="user" name="user" type="text" placeholder="nombre@correo.com" autocomplete="username" autocapitalize="off" spellcheck="false" required aria-describedby="e-user">
        </div>
        <div class="reveal" id="r-user"><div><p class="msg" id="e-user" role="alert"></p></div></div>
      </div>

      <div class="field in" id="f-pass" style="--i:6">
        <div class="label-row">
          <label for="pass">Contraseña</label>
          <a href="#recuperar">¿La olvidaste?</a>
        </div>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="pass" name="pass" type="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password" required aria-describedby="e-pass e-caps">
          <button type="button" class="toggle" id="toggle" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg id="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="reveal" id="r-pass"><div><p class="msg" id="e-pass" role="alert"></p></div></div>
        <div class="reveal" id="r-caps"><div><p class="caps" id="e-caps"></p></div></div>
      </div>

      <label class="check in" style="--i:7"><input type="checkbox" id="remember"> Mantener la sesión iniciada</label>

      <button class="btn in" style="--i:8" type="submit" id="submit" data-state="idle">
        <span class="layers">
          <span class="layer" data-layer="idle">Iniciar sesión <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
          <span class="layer" data-layer="loading"><span class="spin" aria-hidden="true"></span><span class="sr-only">Verificando</span></span>
          <span class="layer" data-layer="done"><svg class="tick" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg> Sesión iniciada</span>
        </span>
      </button>
      <span class="sr-only" id="live" aria-live="polite"></span>
    </form>

    <div class="alt in" style="--i:9">
      <p>¿No tienes cuenta? <a href="../02-registro/code.html">Regístrate gratis</a></p>
      <p class="quiet">¿Trabajas en una agencia? <a href="../../personal/01-login/code.html">Portal de agencias</a></p>
    </div>
  </section>
</main>

<div class="caption" id="caption" hidden>
  <div class="where" id="where"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg><span id="where-txt"></span></div>
  <div class="dots" id="dots"></div>
</div>
<p class="legal">© 2026 RutaAndina · Ayacucho, Perú</p>

<script>
  window.RA_AUTH = {
    /* focus: punto (0–1) donde está el vehículo; side: en pantallas anchas se lleva a la derecha de la tarjeta; zoom: acercamiento máximo */
    slides: [
      {file:'fondo.jpg',   focus:{x:.62,y:.85}, side:true,  place:'Carretera interprovincial · Ayacucho'},
      {file:'fondo-2.jpg', focus:{x:.38,y:.58}, side:true,  zoom:1.5, place:'Bus interprovincial en ruta'},
      {file:'fondo-4.jpg', focus:{x:.47,y:.61}, side:true,  zoom:1.6, place:'Por la puna ayacuchana'},
      {file:'fondo-3.jpg', focus:{x:.50,y:.60}, side:false, place:'Camino a Vilcashuamán · Ayacucho'},
    ],
    fields: ['user', 'pass'],
    validate: ({user, pass}) => ({
      user: !user ? 'Escribe tu correo o DNI.' : (/^\d{8}$/.test(user) || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(user)) ? '' : 'Usa un correo válido o un DNI de 8 dígitos.',
      pass: !pass ? 'Escribe tu contraseña.' : pass.length < 8 ? 'La contraseña tiene al menos 8 caracteres.' : '',
    }),
    accept: ({pass}) => pass === 'rutaandina',
    wrong: {field:'pass', text:'El correo, DNI o contraseña no coinciden.'},
    ok: 'Sesión iniciada',
  };
</script>
<script src="../../_assets/auth.js"></script>
</body>
</html>
