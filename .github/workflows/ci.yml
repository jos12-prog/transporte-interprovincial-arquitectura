name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/backend/TransportPlatform.sln -m:1 -nodeReuse:false

      - name: Build
        run: dotnet build src/backend/TransportPlatform.sln --no-restore -m:1 -nodeReuse:false

      - name: Test with Cobertura collection
        run: dotnet test src/backend/TransportPlatform.sln --no-build --collect:"XPlat Code Coverage" -m:1 -nodeReuse:false

      - name: Restore ReportGenerator
        if: always()
        run: dotnet tool restore

      - name: Generate backend HTML coverage
        if: always()
        shell: bash
        run: |
          if find tests -type f -path '*/TestResults/*/coverage.cobertura.xml' -print -quit | grep -q .; then
            dotnet tool run reportgenerator "-reports:tests/**/TestResults/**/coverage.cobertura.xml" "-targetdir:artifacts/coverage/backend" "-reporttypes:Html"
          else
            echo "No Cobertura files were produced."
          fi

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            tests/**/TestResults/**/coverage.cobertura.xml
            artifacts/coverage/backend/**
          if-no-files-found: warn

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Test frontend with coverage
        working-directory: src/frontend
        run: npm run test -- --coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage/**
          if-no-files-found: warn

  api:
    name: Compose and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: tests/api/package-lock.json

      - name: Install API test dependencies
        working-directory: tests/api
        run: npm ci

      - name: Generate ephemeral JWT keys and test credentials
        shell: bash
        run: |
          bash -n scripts/generate-dev-jwt-keys.sh
          sh scripts/generate-dev-jwt-keys.sh
          openssl pkey -in .secrets/jwt/private.pem -pubout -out /tmp/jwt-public-check.pem
          cmp .secrets/jwt/public.pem /tmp/jwt-public-check.pem
          {
            echo "JWT_ISSUER=transport-platform-ci"
            echo "JWT_KEYS_DIRECTORY=./.secrets/jwt"
            echo "JWT_SIGNING_PRIVATE_KEY_PATH=/run/jwt-keys/private.pem"
            echo "JWT_SIGNING_PUBLIC_KEY_PATH=/run/jwt-keys/public.pem"
            echo "LOGIN_ATTEMPT_HMAC_KEY=$(openssl rand -hex 32)"
            echo "IDENTITY_SEED_SUPER_ADMIN_PASSWORD=$(openssl rand -hex 20)"
            echo "IDENTITY_SEED_AGENCY_ADMIN_PASSWORD=$(openssl rand -hex 20)"
            echo "IDENTITY_SEED_AGENT_PASSWORD=CI-agent-password-2026"
          } >> "$GITHUB_ENV"

      - name: Start Compose stack
        run: docker compose up --build -d

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health; then
              echo "API is healthy."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Test API contracts before login rate-limit suite
        working-directory: tests/api
        env:
          API_BASE_URL: http://localhost:8080
        run: npm run test -- --coverage --coverageDirectory=coverage/platform --runInBand --testPathIgnorePatterns=identity-access.test.ts

      - name: Restart API before login rate-limit suite
        run: docker compose restart api

      - name: Wait for API after restart
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Test identity and login rate limits
        working-directory: tests/api
        env:
          API_BASE_URL: http://localhost:8080
        run: npm run test -- --coverage --coverageDirectory=coverage/identity --runInBand src/identity-access.test.ts

      - name: Restart API before Postman login limit checks
        run: docker compose restart api

      - name: Wait for API before Newman
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Run Sprint 2 Postman collection with Newman
        env:
          IDENTITY_SEED_AGENT_PASSWORD: CI-agent-password-2026
        run: npx --yes newman run tests/postman/RutaAndina-Sprint2.postman_collection.json --env-var "agentPassword=$IDENTITY_SEED_AGENT_PASSWORD" --env-var "agencyAdminPassword=$IDENTITY_SEED_AGENCY_ADMIN_PASSWORD" --env-var "superAdminPassword=$IDENTITY_SEED_SUPER_ADMIN_PASSWORD" --reporters cli,json --reporter-json-export docs/evidencias/postman-sprint2.json

      - name: Upload Postman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-sprint2
          path: docs/evidencias/postman-sprint2.json
          if-no-files-found: warn

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run EQ-02 seat hold concurrency
        env:
          API_BASE_URL: http://localhost:8080
          SEARCH_ORIGIN: Ayacucho
          SEARCH_DESTINATION: Lima
        run: k6 run --summary-export docs/evidencias/concurrencia-eq02-summary.json tests/performance/seat-hold-concurrency.js

      - name: Upload EQ-02 k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-eq02-summary
          path: docs/evidencias/concurrencia-eq02-summary.json
          if-no-files-found: warn

      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: tests/api/coverage/**
          if-no-files-found: warn

      - name: Stop Compose stack
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -rf .secrets/jwt

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@2.1.1

      - name: Validate all OpenSpec artifacts
        run: openspec validate --all --strict
